<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 292" font-family="system-ui,sans-serif">
<text x="0" y="20" font-size="12" fill="#8a929b">QUATTRO ESECUZIONI DELLO STESSO AGENTE - 200 SIMULAZIONI</text>
<line x1="291" y1="30" x2="291" y2="186" stroke="#8a929b" stroke-width="1" stroke-dasharray="3 3"/>
<text x="291" y="202" text-anchor="middle" font-size="12" fill="#8a929b">68% - default</text>
<text x="0" y="52" font-size="13.5" fill="#2b323a">trial 1</text><rect x="80" y="38" width="254" height="19" rx="3" fill="#6d5cf0"/><text x="344" y="52" font-size="13.5" font-weight="700" fill="#2b323a">82%</text><text x="400" y="52" font-size="13" fill="#8a929b">+8 / -1</text><text x="500" y="52" font-size="13" font-weight="700" fill="#6d5cf0">p = 0,039</text><text x="0" y="86" font-size="13.5" fill="#2b323a">trial 2</text><rect x="80" y="72" width="229" height="19" rx="3" fill="#c9cfd6"/><text x="319" y="86" font-size="13.5" font-weight="700" fill="#2b323a">74%</text><text x="400" y="86" font-size="13" fill="#8a929b">+6 / -3</text><text x="500" y="86" font-size="13" font-weight="400" fill="#8a929b">p = 0,508</text><text x="0" y="120" font-size="13.5" fill="#2b323a">trial 3</text><rect x="80" y="106" width="248" height="19" rx="3" fill="#6d5cf0"/><text x="338" y="120" font-size="13.5" font-weight="700" fill="#2b323a">80%</text><text x="400" y="120" font-size="13" fill="#8a929b">+6 / -0</text><text x="500" y="120" font-size="13" font-weight="700" fill="#6d5cf0">p = 0,031</text><text x="0" y="154" font-size="13.5" fill="#2b323a">trial 4</text><rect x="80" y="140" width="267" height="19" rx="3" fill="#6d5cf0"/><text x="357" y="154" font-size="13.5" font-weight="700" fill="#2b323a">86%</text><text x="400" y="154" font-size="13" fill="#8a929b">+9 / -0</text><text x="500" y="154" font-size="13" font-weight="700" fill="#6d5cf0">p = 0,004</text>
<line x1="0" y1="226" x2="700" y2="226" stroke="#e3e7eb"/>
<text x="0" y="254" font-size="17" font-weight="700" fill="#6d5cf0">80,5% di media</text>
<text x="160" y="254" font-size="14" fill="#2b323a">contro 68% - tre repliche su quattro significative</text>
<text x="0" y="280" font-size="13" fill="#8a929b">Ma da 74% a 86% fra esecuzioni identiche: con una sola misura avrei pubblicato l'86%.</text>
