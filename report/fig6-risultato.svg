<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="system-ui,sans-serif">
<text x="0" y="20" font-size="12" fill="#8a929b">LO STESSO AGENTE, QUATTRO ESECUZIONI IDENTICHE</text>
<line x1="371" y1="30" x2="371" y2="196" stroke="#8a929b" stroke-width="1" stroke-dasharray="3 3"/>
<text x="371" y="212" text-anchor="middle" font-size="12" fill="#8a929b">68% - agente di default</text>
<text x="0" y="56" font-size="14" fill="#2b323a">giro 1</text><rect x="86" y="41" width="344" height="21" rx="3" fill="#6d5cf0"/><text x="440" y="56" font-size="14" font-weight="700" fill="#2b323a">82%</text><text x="0" y="92" font-size="14" fill="#2b323a">giro 2</text><rect x="86" y="77" width="311" height="21" rx="3" fill="#6d5cf0"/><text x="407" y="92" font-size="14" font-weight="700" fill="#2b323a">74%</text><text x="0" y="128" font-size="14" fill="#2b323a">giro 3</text><rect x="86" y="113" width="336" height="21" rx="3" fill="#6d5cf0"/><text x="432" y="128" font-size="14" font-weight="700" fill="#2b323a">80%</text><text x="0" y="164" font-size="14" fill="#2b323a">giro 4</text><rect x="86" y="149" width="361" height="21" rx="3" fill="#6d5cf0"/><text x="457" y="164" font-size="14" font-weight="700" fill="#2b323a">86%</text>
<line x1="0" y1="236" x2="700" y2="236" stroke="#e3e7eb"/>
<text x="0" y="266" font-size="19" font-weight="700" fill="#6d5cf0">80,5% di media</text>
<text x="182" y="266" font-size="14" fill="#2b323a">contro il 68% dell'agente di default</text>
<text x="0" y="290" font-size="13" fill="#8a929b">Con una sola esecuzione il risultato pubblicato sarebbe stato 86%.</text>
</svg>