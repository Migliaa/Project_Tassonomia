<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 175" font-family="system-ui,sans-serif">
<rect x="0" y="0" width="222" height="160" rx="10" fill="#fdf3f3" stroke="#f0d4d4"/>
<text x="18" y="34" font-size="16" font-weight="700" fill="#b4453f">Non agisce</text>
<text x="18" y="64" font-size="13" fill="#5b636b">Il cliente crede sia fatto,</text>
<text x="18" y="84" font-size="13" fill="#5b636b">dice si e riaggancia.</text>
<text x="18" y="132" font-size="12" fill="#8a929b">comunica bene, non esegue</text>
<g transform="translate(239,0)">
<rect x="0" y="0" width="222" height="160" rx="10" fill="#fdf7ef" stroke="#f0e2cd"/>
<text x="18" y="34" font-size="16" font-weight="700" fill="#a9741f">Agisce troppo</text>
<text x="18" y="64" font-size="13" fill="#5b636b">Si scrive una giustificazione</text>
<text x="18" y="84" font-size="13" fill="#5b636b">falsa e la usa come permesso.</text>
<text x="18" y="132" font-size="12" fill="#8a929b">esegue cio che e vietato</text>
</g>
<g transform="translate(478,0)">
<rect x="0" y="0" width="222" height="160" rx="10" fill="#f2f4fd" stroke="#d8dcf2"/>
<text x="18" y="34" font-size="16" font-weight="700" fill="#4a55b8">Sceglie male</text>
<text x="18" y="64" font-size="13" fill="#5b636b">Cerca il piu economico e</text>
<text x="18" y="84" font-size="13" fill="#5b636b">si ferma al primo valido.</text>
<text x="18" y="132" font-size="12" fill="#8a929b">valido, ma non il migliore</text>
</g>
</svg>