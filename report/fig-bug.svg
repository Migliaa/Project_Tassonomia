<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" font-family="system-ui,sans-serif">
<rect x="0" y="20" width="300" height="104" rx="8" fill="#f6f7f8" stroke="#e3e7eb"/>
<text x="16" y="44" font-size="12" fill="#8a929b">ESECUZIONE A</text>
<text x="16" y="70" font-size="12" fill="#2b323a" font-family="ui-monospace,monospace">carta 8020792 - $198</text>
<text x="16" y="92" font-size="12" fill="#2b323a" font-family="ui-monospace,monospace">carta 6136092 - $129</text>
<text x="16" y="114" font-size="12" fill="#2f7d4f" font-weight="700">superato</text>
<rect x="330" y="20" width="300" height="104" rx="8" fill="#f6f7f8" stroke="#e3e7eb"/>
<text x="346" y="44" font-size="12" fill="#8a929b">ESECUZIONE B</text>
<text x="346" y="70" font-size="12" fill="#2b323a" font-family="ui-monospace,monospace">carta 6136092 - $129</text>
<text x="346" y="92" font-size="12" fill="#2b323a" font-family="ui-monospace,monospace">carta 8020792 - $198</text>
<text x="346" y="114" font-size="12" fill="#b4453f" font-weight="700">bocciato</text>
<text x="0" y="162" font-size="14" fill="#2b323a">Stesse carte. Stessi importi. Stesso totale. Cambia solo l'ordine.</text>
<rect x="0" y="182" width="660" height="58" rx="8" fill="#f4f2ff" stroke="#6d5cf0"/>
<text x="16" y="206" font-size="13" fill="#6d5cf0" font-weight="700">L'impronta del database ordina le chiavi dei dizionari, non gli elementi delle liste.</text>
<text x="16" y="228" font-size="13" fill="#2b323a">Un task risolto diventa una monetina, dentro un benchmark che misura la costanza.</text>
